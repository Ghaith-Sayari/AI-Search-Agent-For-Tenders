company:
  name: "AlphaUrban Solutions"
  description: "Sustainable Urban Infrastructure, Green Architecture & Public Mobility Solutions Provider"

strategy:
  target_sectors:
    - "Civil Engineering & Infrastructure"
    - "Landscape Architecture & Greening"
    - "Public Transit & Fleet Operations"
    - "Architectural & Urban Design"
  target_countries: ["TN", "FR", "MA"]  # Tunisia, France, Morocco
  preferred_clients:
    - "Government & Municipalities"
    - "Public Transport Authorities (PTAs)"
    - "Urban Development Agencies"
    - "State-Owned Enterprises & Public Utilities"
  excluded_sectors:
    - "Cybersecurity & Software Only"
    - "Heavy Mining & Extraction"
    - "Weapons & Defense Construction"

capabilities:
  services:
    - "architectural design & urban planning"
    - "landscape architectural works & eco-greening"
    - "public transit fleet integration & bus depot works"
    - "civil works & sustainable building construction"
  # Granular tech & operational keywords for exact RFP matching
  technical_keywords:
    architecture_design: ["BIM", "Revit", "Urban Masterplanning", "Sustainable Design", "LEED", "HQE"]
    greening_landscape: ["Urban Forestry", "Green Roofs", "Eco-Design", "Irrigation Systems", "Biodiversity Mapping"]
    bus_mobility: ["Electric Bus (eBus) Infrastructure", "Depot Electrification", "Fleet Management", "BRT Systems", "ITS Integration"]
    civil_construction: ["Structural Engineering", "Site Supervision", "Low-Carbon Concrete", "Permeable Paving", "Earthworks"]
  certifications:
    - "ISO 9001 (Quality Management)"
    - "ISO 14001 (Environmental Management)"
    - "ISO 45001 (Occupational Health & Safety)"
    - "HQE / BREEAM Certified Professional"
  languages: ["English", "French", "Arabic"]

commercial:
  min_budget: 100000
  max_budget: 15000000
  currency: "EUR"
  preferred_contract_types: ["design_build", "public_works_contract", "framework_agreement", "concession"]
  max_project_duration_months: 36

eligibility:
  # Standardized legal/business entity classifications
  allowed_entity_types: ["LLC", "JSC", "Consortium", "Joint Venture"]
  required_documents:
    - "tax_clearance_certificate"
    - "social_security_clearance"
    - "financial_statements_last_3_years"
    - "certificate_of_incorporation"
    - "professional_civil_liability_insurance"
    - "iso_14001_certificate"
  
  # Operational & financial capacity safeguards for capital-intensive projects
  capacity_constraints:
    min_company_age_years: 5
    max_contract_to_turnover_ratio: 0.35  # Single contract value cannot exceed 35% of annual turnover
    min_available_technical_staff: 15

  # Strict dealbreakers (Auto-Reject)
  hard_blockers:
    - "bid bond above 5%"
    - "performance bond above 15%"
    - "mandatory local registration in non-target country prior to award"
    - "unlimited financial liability required"
    - "mandatory joint liability for non-controlled consortium partners"

scoring:
  weights:
    domain_relevance: 0.35
    geography_fit: 0.20
    budget_fit: 0.20
    eligibility_fit: 0.15
    strategic_fit: 0.10
  thresholds:
    good_fit: 75  # Direct Bid
    review: 50    # Human Evaluation / Legal Review
                  # < 50 = Pass / Reject

risk_rules:
  # Critical clauses that force auto-rejection or heavy legal review
  critical_risk_keywords:
    - "unlimited liability"
    - "uncapped delay penalties"
    - "ip transfer of proprietary architectural design prior to payment"
    - "full site clearance liability without geotechnical report"
    - "joint and several liability"
  
  # Standard clauses that trigger caution flags
  medium_risk_keywords:
    - "liquidated damages > 10%"
    - "extended defect liability period > 24 months"
    - "strict environmental penalty clause"
    - "payment terms > 90 days"
    - "retention money > 10%"
  
  max_acceptable_risk_level: "medium"